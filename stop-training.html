<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>STOPトレーニング</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Rampart+One&family=RocknRoll+One&display=swap">
<style>
  :root { box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    --bg:#0B0C1E; --panel:#14162E; --ink:#F1EFE8; }
  html { min-height:100%; scroll-padding-top:env(safe-area-inset-top,0px); background:var(--bg); }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100%; display:flex; justify-content:center; background:var(--bg); color:var(--ink);
    font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif; -webkit-text-size-adjust:100%; }
  button { font-family:inherit; }
  img { -webkit-user-drag:none; user-select:none; display:block; }
  #screen { position:relative; width:100%; max-width:440px; min-height:100vh; display:flex; flex-direction:column; overflow:hidden; background:var(--panel); }
  .ico { width:1em; height:1em; fill:none; stroke:currentColor; stroke-width:2.8; stroke-linecap:round; stroke-linejoin:round; vertical-align:-0.12em; }
  .gbtn { transition:transform .08s; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .gbtn:active { transform:translateY(3px); }
  .gbtn[disabled] { opacity:.6; cursor:default; }
  .bub { position:relative; background:var(--bg,#F1EFE8); color:#2C2C2A; font-size:11px; font-weight:800; line-height:1.4; padding:5px 9px; border-radius:12px; }
  .bub.down:after { content:""; position:absolute; bottom:-5px; left:50%; margin-left:-5px; border:5px solid transparent; border-top-color:var(--bg,#F1EFE8); border-bottom:0; }
  .bub.left:after { content:""; position:absolute; left:-5px; top:50%; margin-top:-5px; border:5px solid transparent; border-right-color:var(--bg,#F1EFE8); border-left:0; }
  .deco { position:absolute; right:-10px; top:-6px; font-size:26px; line-height:1; }
  .rays { position:absolute; left:50%; top:210px; width:1000px; height:1000px; margin:-500px 0 0 -500px; border-radius:50%;
    background:repeating-conic-gradient(var(--ray,rgba(250,199,117,.2)) 0deg 8deg, transparent 8deg 16deg);
    -webkit-mask-image:radial-gradient(circle at center,#000 0,transparent 62%); mask-image:radial-gradient(circle at center,#000 0,transparent 62%);
    animation:spin 70s linear infinite; pointer-events:none; }
  .ribbon { clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%); padding:3px; }
  .ribbonIn { clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%); padding:9px 46px; text-align:center; }
  .ribbonText { font-size:28px; font-weight:800; color:#fff; letter-spacing:2px; -webkit-text-stroke:6px var(--rs,#6B1F0A); paint-order:stroke fill; }
  .slot { position:relative; }
  .gold { position:absolute; left:0; top:0; right:0; bottom:0; opacity:0; }
  .gold.hit { animation:starHit .55s ease-out both; }
  .gold.on { opacity:1; }
  .spark { position:absolute; border-radius:50%; animation:burst .75s ease-out forwards; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes starHit { 0%{transform:scale(3.4) rotate(-40deg);opacity:0} 55%{transform:scale(.82) rotate(6deg);opacity:1} 75%{transform:scale(1.14) rotate(-3deg);opacity:1} 100%{transform:scale(1) rotate(0);opacity:1} }
  @keyframes burst { 0%{transform:translate(0,0) scale(.4);opacity:1} 100%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0} }
  @keyframes popIn { 0%{transform:scale(.4);opacity:0} 70%{transform:scale(1.15);opacity:1} 100%{transform:scale(1);opacity:1} }
  @keyframes slideUp { from{transform:translateY(12px);opacity:0} to{transform:translateY(0);opacity:1} }
  @keyframes stampIn { 0%{transform:rotate(-8deg) scale(2.4);opacity:0} 60%{transform:rotate(-8deg) scale(.92);opacity:1} 100%{transform:rotate(-8deg) scale(1)} }
  @keyframes bounceDot { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }
  @keyframes inRight { from{transform:translateX(100%)} to{transform:translateX(0)} }
  @keyframes inLeft { from{transform:translateX(-100%)} to{transform:translateX(0)} }
  @keyframes outLeft { from{transform:translateX(0);opacity:1} to{transform:translateX(-30%);opacity:.35} }
  @keyframes outRight { from{transform:translateX(0);opacity:1} to{transform:translateX(30%);opacity:.35} }
  @keyframes cardIn { from{transform:translateY(16px) scale(.96);opacity:0} to{transform:none;opacity:1} }
  @keyframes floaty { from{transform:translateY(0)} to{transform:translateY(-5px)} }
  @keyframes floatyBig { from{transform:translateY(0)} to{transform:translateY(-9px)} }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(5px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(3px)} }
  @keyframes confetti { 0%{transform:translate(0,0) scale(.6) rotate(0);opacity:1} 55%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(200deg);opacity:1} 100%{transform:translate(var(--dx),calc(var(--dy) + 70px)) scale(1) rotate(420deg);opacity:0} }
  @keyframes drift { from{transform:translateX(-170px)} to{transform:translateX(520px)} }
  @keyframes twinkle { 0%,100%{transform:scale(.6);opacity:.35} 50%{transform:scale(1.15);opacity:1} }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }
  @keyframes hop { 0%,100%{transform:translateY(0)} 40%{transform:translateY(-11px)} }
  @keyframes wiggle { 0%,100%{transform:rotate(-4deg)} 50%{transform:rotate(4deg)} }
  @keyframes panic { 0%,100%{transform:translateX(0) rotate(0)} 25%{transform:translateX(-3px) rotate(-5deg)} 75%{transform:translateX(3px) rotate(5deg)} }
  @keyframes breathe { from{transform:scale(1)} to{transform:scale(1.05)} }
  @keyframes titlePop { 0%{opacity:0; transform:scale(.35);} 65%{opacity:1; transform:scale(1.14);} 100%{opacity:1; transform:scale(1);} }
  @keyframes titleGentleIn { from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);} }
  @keyframes bangFlinch { 0%,100%{transform:rotate(0deg);} 20%{transform:rotate(-16deg);} 40%{transform:rotate(13deg);} 60%{transform:rotate(-9deg);} 80%{transform:rotate(6deg);} }
  .titleL1 { opacity:0; transform-box:fill-box; transform-origin:center; animation:titlePop .5s cubic-bezier(.34,1.4,.64,1) .1s both; }
  .titleBang { transform-box:fill-box; transform-origin:50% 75%; animation:bangFlinch .55s ease-in-out .55s both; }
  .titleL2 { opacity:0; transform-box:fill-box; transform-origin:center; animation:titleGentleIn .7s ease-out .75s both; }
  @media (prefers-reduced-motion: reduce){
    .titleL1,.titleL2,.titleBang{ animation:none; opacity:1; }
  }
  .pop { animation:popIn .4s ease-out both; }
  .slide { animation:slideUp .3s ease-out; }
  .slideBoth { animation:slideUp .4s ease-out both; }
  .stamp { animation:stampIn .3s ease-out both; }
  .tdot { display:inline-block; width:8px; height:8px; border-radius:50%; margin:0 2px; animation:bounceDot 1s infinite; }
  .tdot:nth-child(2){ animation-delay:.15s; }
  .tdot:nth-child(3){ animation-delay:.3s; }
  .inRight { animation:inRight .34s cubic-bezier(.22,.8,.3,1) both; }
  .inLeft { animation:inLeft .34s cubic-bezier(.22,.8,.3,1) both; }
  .outLeft { animation:outLeft .34s ease-in both; }
  .outRight { animation:outRight .34s ease-in both; }
  .cardIn { animation:cardIn .4s ease-out backwards; }
  .float { animation:floaty 2.2s ease-in-out infinite alternate; }
  .floatBig { animation:floatyBig 2.6s ease-in-out infinite alternate; }
  .shake { animation:shake .35s; }
  .confetti { position:absolute; animation:confetti 1.1s ease-out forwards; }
  .cloud { position:absolute; animation:drift linear infinite; }
  .sparkle { position:absolute; animation:twinkle 2s ease-in-out infinite; }
  .pulse { animation:pulse 1.8s ease-in-out infinite; }
  .hop { animation:hop .8s ease-in-out infinite; }
  .wiggle { animation:wiggle .5s ease-in-out infinite; }
  .panic { animation:panic .25s linear infinite; }
  .breathe { animation:breathe 1.6s ease-in-out infinite alternate; }
  @media (prefers-reduced-motion: reduce){
    .pop,.slide,.slideBoth,.stamp,.tdot,.inRight,.inLeft,.outLeft,.outRight,.cardIn,.float,.floatBig,.shake,.confetti,.cloud,.sparkle,.pulse,.hop,.wiggle,.panic,.breathe,.rays,.gold.hit,.spark{ animation:none; }
    .gold.hit { opacity:1; }
    .gbtn{ transition:none; }
  }
</style>
</head>
<body>

      fromEl.style.zIndex = "";
      fromEl.classList.remove("outLeft", "outRight");
      toEl.classList.remove("inLeft", "inRight");
      toEl.style.position = "";
      toEl.style.zIndex = "";
      navLock = false;
    }, 360);
  }

  function animateCards(){
    if(reduce) return;
    var cards = document.querySelectorAll(".scenarioBtn");
    for(var i=0; i<cards.length; i++){
      cards[i].classList.remove("cardIn");
      void cards[i].offsetWidth;
      cards[i].style.animationDelay = (120 + i*70) + "ms";
      cards[i].classList.add("cardIn");
    }
  }

  function clearTimers(){
    if(typingTimer){ clearTimeout(typingTimer); typingTimer = null; }
    if(stampTimer){ clearTimeout(stampTimer); stampTimer = null; }
    for(var i=0; i<starTimers.length; i++){ clearTimeout(starTimers[i]); }
    starTimers = [];
    if(typingRow && typingRow.parentNode){ typingRow.parentNode.removeChild(typingRow); }
    typingRow = null;
    busy = false;
    stamping = false;
    stampEl.style.display = "none";
    continueBtn.disabled = false;
  }

  var lastVariantByKey = {};
  function pickVariant(){
    var scenario = scenarios[currentScenarioKey];
    activeIsScam = Math.random() < 0.5;
    var pool = activeIsScam ? scenario.scam : scenario.normal;
    if(Array.isArray(pool)){
      var pick = pool[Math.floor(Math.random() * pool.length)];
      if(pool.length > 1 && pick === lastVariantByKey[currentScenarioKey]){
        pick = pool[Math.floor(Math.random() * pool.length)];
      }
      activeVariant = pick;
      lastVariantByKey[currentScenarioKey] = pick;
    } else {
      activeVariant = pool;
    }
    current = 0;
  }

  function applyTheme(key){
    var t = themes[key];
    playHeader.style.background = t.accent;
    stepBadge.style.color = t.accent;
  }

  function buildAvatar(t){
    var avatar = document.createElement("div");
    avatar.style.width = "36px";
    avatar.style.height = "36px";
    avatar.style.flexShrink = "0";
    avatar.style.borderRadius = "50%";
    avatar.style.background = t.tile;
    avatar.style.display = "flex";
    avatar.style.alignItems = "center";
    avatar.style.justifyContent = "center";
    avatar.style.fontSize = "18px";
    avatar.textContent = t.icon;
    return avatar;
  }

  function renderMessage(text){
    var t = themes[currentScenarioKey];
    var row = document.createElement("div");
    row.className = "slide";
    row.style.display = "flex";
    row.style.gap = "8px";
    row.style.alignItems = "flex-start";

    var bubble = document.createElement("div");
    bubble.style.background = "#1F2244";
    bubble.style.border = "2px solid " + t.border;
    bubble.style.borderRadius = "4px 18px 18px 18px";
    bubble.style.padding = "10px 14px";
    bubble.style.flex = "1";
    bubble.style.minWidth = "0";

    var sender = document.createElement("p");
    sender.textContent = scenarios[currentScenarioKey].sender;
    sender.style.margin = "0 0 4px";
    sender.style.fontSize = "11px";
    sender.style.fontWeight = "800";
    sender.style.color = t.light;

    var body = document.createElement("p");
    body.textContent = text;
    body.style.margin = "0";
    body.style.fontSize = "14px";
    body.style.lineHeight = "1.75";
    body.style.color = "#F1EFE8";
    body.style.fontWeight = "700";
    body.style.wordBreak = "break-all";

    bubble.appendChild(sender);
    bubble.appendChild(body);
    row.appendChild(buildAvatar(t));
    row.appendChild(bubble);
    messagesEl.appendChild(row);
  }

  function showTyping(){
    var t = themes[currentScenarioKey];
    var row = document.createElement("div");
    row.className = "slide";
    row.style.display = "flex";
    row.style.gap = "8px";
    row.style.alignItems = "center";
    var bubble = document.createElement("div");
    bubble.style.background = "#1F2244";
    bubble.style.border = "2px solid " + t.border;
    bubble.style.borderRadius = "4px 18px 18px 18px";
    bubble.style.padding = "12px 16px";
    for(var i=0; i<3; i++){
      var d = document.createElement("span");
      d.className = "tdot";
      d.style.background = t.light;
      bubble.appendChild(d);
    }
    row.appendChild(buildAvatar(t));
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    typingRow = row;
  }

  function showStep(){
    stepBadge.textContent = "STEP " + (current+1);
    renderMessage(activeVariant.steps[current].text);
  }

  /* ---------- 星リザルト ---------- */
  function starSvg(gold){
    var pts = "50,6 61,38 95,38 67,58 78,92 50,71 22,92 33,58 5,38 39,38";
    if(gold){
      return '<svg viewBox="0 0 100 100" width="100%" height="100%" style="overflow:visible"><polygon points="'+pts+'" fill="#FFC531" stroke="#B7791F" stroke-width="5" stroke-linejoin="round"/><path d="M38 36 Q50 20 60 34" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".75"/></svg>';
    }
    return '<svg viewBox="0 0 100 100" width="100%" height="100%" style="overflow:visible"><polygon points="'+pts+'" fill="#1B1E44" stroke="#3C3489" stroke-width="5" stroke-linejoin="round"/></svg>';
  }

  function later(fn, ms){ starTimers.push(setTimeout(fn, ms)); }

  function burstAt(slot){
    var palette = ["#FFC531","#FAC775","#ffffff","#F0997B"];
    for(var i=0; i<12; i++){
      var p = document.createElement("div");
      p.className = "spark";
      var s = 5 + (i % 3) * 2;
      p.style.width = s + "px";
      p.style.height = s + "px";
      p.style.left = "calc(50% - " + (s/2) + "px)";
      p.style.top = "calc(50% - " + (s/2) + "px)";
      p.style.background = palette[i % palette.length];
      var a = i * Math.PI * 2 / 12;
      var d = 52 + (i % 2) * 22;
      p.style.setProperty("--dx", (Math.cos(a)*d) + "px");
      p.style.setProperty("--dy", (Math.sin(a)*d) + "px");
      slot.appendChild(p);
      (function(el){ setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 900); })(p);
    }
  }

  function shakeStar(){
    if(reduce) return;
    starView.classList.remove("shake");
    void starView.offsetWidth;
    starView.classList.add("shake");
  }

  function revealFinal(){
    if(!starFinal) return;
    for(var i=0; i<starTimers.length; i++){ clearTimeout(starTimers[i]); }
    starTimers = [];
    var slots = document.querySelectorAll("#starRow .slot");
    for(var k=0; k<slots.length; k++){
      var g = slots[k].querySelector(".gold");
      g.classList.remove("hit");
      if(k < starFinal.stars){ g.classList.add("on"); }
    }
    document.getElementById("ribbonWrap").style.opacity = "1";
    var ids = ["starInfo","charStage","starBtnWrap"];
    for(var j=0; j<ids.length; j++){ document.getElementById(ids[j]).style.opacity = "1"; }
    document.getElementById("newRecord").style.opacity = starFinal.record ? "1" : "0";
  }

  function fadeIn(id, cls, delayMs){
    var el = document.getElementById(id);
    el.style.opacity = "1";
    el.classList.remove(cls);
    void el.offsetWidth;
    el.style.animationDelay = (delayMs||0) + "ms";
    el.classList.add(cls);
  }

  function runStarSequence(stars, record){
    starFinal = {stars:stars, record:record};
    if(reduce){ revealFinal(); return; }
    var slots = document.querySelectorAll("#starRow .slot");
    later(function(){ fadeIn("ribbonWrap", "pop", 0); }, 380);
    for(var i=0; i<stars; i++){
      (function(idx){
        later(function(){
          var g = slots[idx].querySelector(".gold");
          g.classList.add("hit");
          burstAt(slots[idx]);
          shakeStar();
        }, 1050 + idx*650);
      })(i);
    }
    var tEnd = 1050 + Math.max(stars,1)*650 + 250;
    later(function(){ fadeIn("starInfo", "slideBoth", 0); if(record){ fadeIn("newRecord", "pop", 150); } }, tEnd);
    later(function(){ fadeIn("charStage", "slideBoth", 0); }, tEnd + 250);
    later(function(){ fadeIn("starBtnWrap", "slideBoth", 0); }, tEnd + 700);
  }

  function setChar(imgId, decoId, key, deco, anim){
    var img = document.getElementById(imgId);
    img.className = anim || "";
    img.src = IMG[key];
    document.getElementById(decoId).textContent = deco || "";
  }

  function showResult(data, stepLabel, stopIdx){
    var s = resultStyles[data.color];
    var stars = starsFor(data.evalLabel);
    var isScam = activeIsScam;
    var o = outcomeFor(data, stopIdx, stars, isScam);
    var r = ratings[stars];
    if(!isScam && stopIdx !== -1){
      r = {text:"警戒しすぎたー！", bg:r.bg, edge:r.edge, stroke:r.stroke, ray:r.ray};
    }
    var prev = best[currentScenarioKey] || 0;
    var record = (stars > prev && stars > 0);
    if(stars > prev){ best[currentScenarioKey] = stars; }

    /* 星リザルト画面 */
    document.getElementById("starStage").textContent = scenarios[currentScenarioKey].title;
    starView.style.setProperty("--ray", r.ray);
    var wrap = document.getElementById("ribbonWrap");
    wrap.style.opacity = "0";
    wrap.classList.remove("pop");
    document.getElementById("ribbonOuter").style.background = r.edge;
    document.getElementById("ribbonInner").style.background = r.bg;
    var rt = document.getElementById("ribbonText");
    rt.textContent = r.text;
    rt.style.setProperty("--rs", r.stroke);

    var row = document.getElementById("starRow");
    row.innerHTML = "";
    var sizes = [80, 112, 80], rots = [-10, 0, 10], offs = [30, 0, 30];
    for(var i=0; i<3; i++){
      var slot = document.createElement("div");
      slot.className = "slot";
      slot.style.width = sizes[i] + "px";
      slot.style.height = sizes[i] + "px";
      slot.style.marginTop = offs[i] + "px";
      slot.style.transform = "rotate(" + rots[i] + "deg)";
      slot.innerHTML = starSvg(false) + '<div class="gold">' + starSvg(true) + '</div>';
      row.appendChild(slot);
    }

    ["starInfo","charStage","starBtnWrap","newRecord"].forEach(function(id){
      var el = document.getElementById(id);
      el.style.opacity = "0";
      el.classList.remove("slideBoth");
      el.classList.remove("pop");
    });
    document.getElementById("starHeadline").textContent = o.head;
    document.getElementById("starEval").textContent = data.evalLabel;
    setChar("saImg", "saDeco", o.sa, o.saDeco, saAnimOf[o.sa]);
    setChar("daImg", "daDeco", o.da, o.daDeco, daAnimOf[o.da]);
    document.getElementById("saBubble").textContent = o.saLine;
    document.getElementById("daBubble").textContent = o.daLine;

    /* 解説画面 */
    document.getElementById("resultBanner").style.background = s.bg;
    var stepLine = document.getElementById("resultStepLine");
    stepLine.textContent = stepLabel;
    stepLine.style.color = s.fg;
    document.getElementById("resultBackBtn").style.color = s.fg;
    var head = document.getElementById("resultHeadline");
    head.textContent = o.head;
    head.style.color = s.fg;
    var badge = document.getElementById("resultEvalBadge");
    badge.textContent = data.evalLabel;
    badge.style.color = s.fg;
    var mini = document.getElementById("miniStars");
    mini.innerHTML = "";
    for(var m=0; m<3; m++){
      var ms = document.createElement("span");
      ms.textContent = "★";
      ms.style.color = s.fg;
      ms.style.opacity = m < stars ? "1" : "0.3";
      mini.appendChild(ms);
    }
    document.getElementById("resultReason").textContent = data.reason;
    document.getElementById("resultExplanation").textContent = activeVariant.explanation;

    var track = document.getElementById("resultTrack");
    track.innerHTML = "";
    var accent = themes[currentScenarioKey].border;
    var total = activeVariant.steps.length;
    for(var k=0; k<total; k++){
      var dot = document.createElement("div");
      dot.style.width = "28px";
      dot.style.height = "28px";
      dot.style.borderRadius = "50%";
      dot.style.display = "flex";
      dot.style.alignItems = "center";
      dot.style.justifyContent = "center";
      dot.style.fontSize = "12px";
      dot.style.fontWeight = "800";
      if(stopIdx === k){
        dot.style.background = "#EF9F27";
        dot.style.border = "2px solid #FAC775";
        dot.style.fontSize = "14px";
        dot.textContent = "✋";
      } else if(stopIdx === -1 || k < stopIdx){
        dot.style.background = accent;
        dot.style.color = "#fff";
        dot.textContent = String(k+1);
      } else {
        dot.style.background = "#14162E";
        dot.style.border = "2px dashed #5F5E7A";
        dot.style.color = "#8A88A8";
        dot.textContent = String(k+1);
      }
      track.appendChild(dot);
    }

    navigate("star", "forward");
    runStarSequence(stars, record);
  }

  function startScenario(key){
    clearTimers();
    currentScenarioKey = key;
    playTitle.textContent = scenarios[key].title;
    applyTheme(key);
    messagesEl.innerHTML = "";
    pickVariant();
    showStep();
    navigate("play", "forward");
  }

  function goHome(){
    clearTimers();
    navigate("home", "back");
    animateCards();
  }

  var scenarioButtons = document.querySelectorAll(".scenarioBtn");
  for(var i=0; i<scenarioButtons.length; i++){
    scenarioButtons[i].addEventListener("click", function(e){
      if(navLock) return;
      startScenario(e.currentTarget.getAttribute("data-scenario"));
    });
  }

  document.getElementById("startBtn").addEventListener("click", function(){
    if(navLock) return;
    navigate("home", "forward");
    animateCards();
  });
  document.getElementById("homeBackBtn").addEventListener("click", function(){
    if(navLock) return;
    navigate("title", "back");
  });
  document.getElementById("backBtn").addEventListener("click", function(){ if(navLock) return; goHome(); });
  document.getElementById("starBackBtn").addEventListener("click", function(e){ e.stopPropagation(); if(navLock) return; goHome(); });
  document.getElementById("resultBackBtn").addEventListener("click", function(){ if(navLock) return; goHome(); });
  document.getElementById("toHomeBtn").addEventListener("click", function(){ if(navLock) return; goHome(); });
  document.getElementById("toDetailBtn").addEventListener("click", function(e){
    e.stopPropagation();
    if(navLock) return;
    for(var t=0; t<starTimers.length; t++){ clearTimeout(starTimers[t]); }
    starTimers = [];
    navigate("result", "forward");
  });
  starView.addEventListener("click", function(){ revealFinal(); });

  continueBtn.addEventListener("click", function(){
    if(busy || stamping || navLock) return;
    if(current < activeVariant.steps.length - 1){
      busy = true;
      continueBtn.disabled = true;
      showTyping();
      typingTimer = setTimeout(function(){
        if(typingRow && typingRow.parentNode){ typingRow.parentNode.removeChild(typingRow); }
        typingRow = null;
        current++;
        showStep();
        busy = false;
        continueBtn.disabled = false;
      }, reduce ? 0 : 700);
    } else {
      showResult(activeVariant.finalOutcome, "最後まで会話を続けました", -1);
    }
  });

  document.getElementById("stopBtn").addEventListener("click", function(){
    if(stamping || navLock) return;
    var stoppedAt = current;
    if(typingTimer){ clearTimeout(typingTimer); typingTimer = null; }
    if(typingRow && typingRow.parentNode){ typingRow.parentNode.removeChild(typingRow); }
    typingRow = null;
    busy = false;
    continueBtn.disabled = false;
    stamping = true;
    var d = activeVariant.steps[stoppedAt];
    if(reduce){
      stamping = false;
      showResult(d, "STEP " + (stoppedAt+1) + "でSTOPしました", stoppedAt);
      return;
    }
    stampEl.style.display = "flex";
    screenEl.classList.remove("shake");
    void screenEl.offsetWidth;
    screenEl.classList.add("shake");
    stampTimer = setTimeout(function(){
      stampEl.style.display = "none";
      screenEl.classList.remove("shake");
      stamping = false;
      showResult(d, "STEP " + (stoppedAt+1) + "でSTOPしました", stoppedAt);
    }, 650);
  });

  document.getElementById("retryBtn").addEventListener("click", function(){
    if(navLock) return;
    startScenario(currentScenarioKey);
  });
})();
</script>
</body>
</html>
